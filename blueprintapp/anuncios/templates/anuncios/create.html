{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Publicar nuevo anuncio</h4>
            </div>

            <div class="card-body">

                <form action="{{ url_for('bp_anuncio.create') }}"
                      method="POST">

                    <div class="mb-3">
                        <label class="form-label">Título del anuncio:</label>

                        <input type="text" name="titulo" class="form-control" placeholder="Ej. Se busca ayudante" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción:</label>

                        <textarea name="descripcion" class="form-control" rows="4" placeholder="Describe el anuncio" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ubicación:</label>

                        <input type="text" name="ubicacion" class="form-control" placeholder="Ej. El Alto, Villa Adela" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contacto:</label>

                        <input type="text" name="contacto" class="form-control" placeholder="Teléfono o correo electrónico" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría:</label>

                        <select name="categoria_id" class="form-select" required>

                            <option value="">
                                Seleccione una categoría
                            </option>

                            {% for item in categorias %}

                            <option value="{{ item.id }}">
                                {{ item.nombre }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Publicar anuncio
                    </button>

                    <a href="{{ url_for('bp_anuncio.index') }}" class="btn btn-secondary">
                        Cancelar
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
