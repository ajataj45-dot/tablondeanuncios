{% extends "base.html" %}

{% block content %}

<h1>Listado de categorías</h1>

<a href="{{ url_for('bp_categoria.create') }}" class="btn btn-primary mb-3">

    Nueva categoría

</a>

<table class="table table-bordered">

    <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>

        </tr>

    </thead>

    <tbody>

        {% for item in categorias %}

        <tr>

            <td>{{ item.id }}</td>

            <td>{{ item.nombre }}</td>

            <td>{{ item.descripcion }}</td>

            <td>
                <a href="{{ url_for('bp_categoria.edit', id=item.id) }}" class="btn btn-warning btn-sm">
                    Editar
                </a>

                <form method="POST" action="{{ url_for('bp_categoria.delete', id=item.id) }}" class="d-inline" onsubmit="return confirm('¿Estás seguro de eliminar esta categoría?');">

                    <button type="submit" class="btn btn-danger btn-sm">
                        Eliminar
                    </button>
                    
                </form>
            </td>

        </tr>

        {% else %}

        <tr>

            <td colspan="4">No hay categorías registradas</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
