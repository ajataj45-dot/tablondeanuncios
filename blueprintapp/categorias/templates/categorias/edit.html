{% extends "base.html" %}

{% block content %}

<h1>Editar categoría</h1>

<form action="{{ url_for('bp_categoria.edit', id=categoria.id) }}" method="POST">

    <div class="mb-3">

        <label>Nombre:</label>

        <input type="text" name="nombre" value="{{ categoria.nombre }}" class="form-control" required>

    </div>

    <div class="mb-3">

        <label>Descripción:</label>

        <textarea name="descripcion" class="form-control" required>{{ categoria.descripcion }}</textarea>

    </div>

    <input type="submit" value="Actualizar" class="btn btn-primary">

    <a href="{{ url_for('bp_categoria.index') }}" class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
