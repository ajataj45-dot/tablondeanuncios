{% extends "base.html" %}

{% block content %}

<h1>Listado de usuarios</h1>

<a href="{{ url_for('bp_usuario.create') }}" class="btn btn-primary mb-3">

    Nuevo usuario

</a>

<table class="table table-bordered table-striped">

    <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Acciones</th>

        </tr>

    </thead>

    <tbody>

        {% for item in usuarios %}

        <tr>

            <td>{{ item.id }}</td>

            <td>{{ item.nombre }}</td>

            <td>{{ item.email }}</td>

            <td>

                <a href="{{ url_for('bp_usuario.edit', id=item.id) }}" class="btn btn-warning btn-sm">

                    Editar

                </a>

                <form method="POST" action="{{ url_for('bp_usuario.delete', id=item.id) }}" class="d-inline" onsubmit="return confirm('¿Estás seguro de eliminar este usuario?');">

                    <button type="submit" class="btn btn-danger btn-sm">
                        Eliminar
                    </button>

                </form>

            </td>

        </tr>

        {% else %}

        <tr>

            <td colspan="4">No hay usuarios registrados</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
