{% extends "base.html" %}

{% block content %}

<h1>Crear usuario</h1>

<form action="{{ url_for('bp_usuario.create') }}" method="POST">

    <div class="mb-3">

        <label>Nombre:</label>

        <input type="text" name="nombre" class="form-control" required>

    </div>

    <div class="mb-3">

        <label>Correo:</label>

        <input type="email" name="email" class="form-control" required>

    </div>

    <div class="mb-3">

        <label>Contraseña:</label>

        <input type="password" name="password"class="form-control" minlength="6" required>

    </div>

    <input type="submit" value="Guardar" class="btn btn-primary">

    <a href="{{ url_for('bp_usuario.index') }}" class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
